<script>
"use strict";

var _pt = window.pretext;
var prepareWithSegments = _pt.prepareWithSegments;
var layoutNextLine = _pt.layoutNextLine;

var stage = document.getElementById("stage");
var fxCanvas = document.getElementById("fx");
var fxCtx = fxCanvas.getContext("2d");

var TEXT = "I am dotted silver threads dropped from heaven by the gods. Nature then takes me, to adorn her fields and valleys. I am beautiful pearls, plucked from the crown of Ishtar by the daughter of Dawn to embellish the gardens. When I cry the hills laugh; when I humble myself the flowers rejoice; when I bow, all things are elated. The field and the cloud are lovers and between them I am a messenger of mercy. I quench the thirst of one; I cure the ailment of the other. The voice of thunder declares my arrival; the rainbow announces my departure. I am like earthly life, which begins at the feet of the mad elements and ends under the upraised wings of death. I emerge from the heart of the sea and soar with the breeze. When I see a field in need, I descend and embrace the flowers and the trees in a million little ways. I touch gently at the windows with my soft fingers, and my announcement is a welcome song. All can hear, but only the sensitive can understand. The heat in the air gives birth to me, but in turn I kill it, as woman overcomes man with the strength she takes from him. I am the sigh of the sea; the laughter of the field; the tears of heaven. So with love — sighs from the deep sea of affection; laughter from the colorful field of the spirit; tears from the endless heaven of memories. ";

var FONT = '8.5px "Cormorant Garamond", serif';
var LINE_HEIGHT = 13;
var MARGIN = 16;

var W, H, dpr;
var prepared = null;
var linePool = [];
var drops = [];

var SIM_SCALE = 2;
var simW = 0, simH = 0;
var curr, prev, temp;

function initSim() {
  simW = Math.ceil(W / SIM_SCALE) + 2;
  simH = Math.ceil(H / SIM_SCALE) + 2;
  var n = simW * simH;
  curr = new Float32Array(n);
  prev = new Float32Array(n);
}

function simStep() {
  var dampVal = Number(document.getElementById("damping").value);
  var damping = 1.0 - Math.pow(10, -2 - dampVal * 0.02);
  temp = prev; prev = curr; curr = temp;
  var c2 = 0.2;
  for (var y = 1; y < simH - 1; y++) {
    for (var x = 1; x < simW - 1; x++) {
      var i = y * simW + x;
      var laplacian = prev[i - 1] + prev[i + 1] + prev[i - simW] + prev[i + simW] - 4.0 * prev[i];
      curr[i] = (2.0 * prev[i] - curr[i] + c2 * laplacian) * damping;
    }
  }
}

function simPoke(px, py, strength) {
  var cx = Math.round(px / SIM_SCALE);
  var cy = Math.round(py / SIM_SCALE);
  var radius = 6;
  for (var dy = -radius; dy <= radius; dy++) {
    for (var dx = -radius; dx <= radius; dx++) {
      var sx = cx + dx;
      var sy = cy + dy;
      if (sx < 1 || sx >= simW - 1 || sy < 1 || sy >= simH - 1) continue;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > radius) continue;
      var t = d / radius;
      var falloff = Math.exp(-5.0 * t * t);
      curr[sy * simW + sx] += strength * falloff;
    }
  }
}

function getBandMaxAbs(bandTop, bandBottom) {
  var y0 = Math.max(1, Math.floor(bandTop / SIM_SCALE));
  var y1 = Math.min(simH - 2, Math.ceil(bandBottom / SIM_SCALE));
  var maxArr = new Float32Array(simW);
  for (var y = y0; y <= y1; y++) {
    for (var x = 0; x < simW; x++) {
      var v = Math.abs(curr[y * simW + x]);
      if (v > maxArr[x]) maxArr[x] = v;
    }
  }
  return maxArr;
}

function Drop2(initial) { this.reset(initial); }
Drop2.prototype.reset = function(initial) {
  this.landX = Math.random() * W;
  this.landY = MARGIN + Math.random() * (H - MARGIN * 2);
  this.x = this.landX;
  this.y = initial ? this.landY - Math.random() * H : this.landY - 200 - Math.random() * 400;
  this.speed = 2 + Math.random() * 3;
  this.len = 12 + Math.random() * 25;
  this.opacity = 0.04 + Math.random() * 0.12;
  this.depth = 0.3 + Math.random() * 0.7;
};
Drop2.prototype.update = function() {
  this.y += this.speed * this.depth;
  if (this.y >= this.landY) {
    simPoke(this.landX, this.landY, -180);
    this.reset(false);
  }
};

function carveFromHeightfield(bandTop, bandBottom, pageLeft, pageRight, threshold) {
  var bandMax = getBandMaxAbs(bandTop, bandBottom);
  var blocked = [];
  var inBlock = false;
  var blockStart = 0;
  for (var x = 0; x < simW; x++) {
    var px = x * SIM_SCALE;
    if (bandMax[x] > threshold) {
      if (!inBlock) { inBlock = true; blockStart = px; }
    } else {
      if (inBlock) { inBlock = false; blocked.push({ left: blockStart - 4, right: px + 4 }); }
    }
  }
  if (inBlock) blocked.push({ left: blockStart - 4, right: simW * SIM_SCALE + 4 });

  var slots = [{ left: pageLeft, right: pageRight }];
  for (var b = 0; b < blocked.length; b++) {
    var interval = blocked[b];
    var next = [];
    for (var s = 0; s < slots.length; s++) {
      var slot = slots[s];
      if (interval.right <= slot.left || interval.left >= slot.right) { next.push(slot); continue; }
      if (interval.left > slot.left) next.push({ left: slot.left, right: interval.left });
      if (interval.right < slot.right) next.push({ left: interval.right, right: slot.right });
    }
    slots = next;
  }
  var result = [];
  for (var i = 0; i < slots.length; i++) {
    if (slots[i].right - slots[i].left >= 14) result.push(slots[i]);
  }
  return result;
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  fxCanvas.width = W * dpr;
  fxCanvas.height = H * dpr;
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  initSim();
  doPrep();
}

function doPrep() {
  var neededChars = Math.ceil((W / 7) * (H / LINE_HEIGHT)) * 3;
  var fullText = TEXT;
  while (fullText.length < neededChars) fullText += TEXT;
  prepared = prepareWithSegments(fullText, FONT);
}

function layoutText() {
  var threshold = Number(document.getElementById("threshold").value);
  var pageLeft = MARGIN;
  var pageRight = W - MARGIN;
  var cursor = { segmentIndex: 0, graphemeIndex: 0 };
  var y = MARGIN;
  var lineIndex = 0;

  while (y + LINE_HEIGHT < H - 20) {
    var slots = carveFromHeightfield(y, y + LINE_HEIGHT, pageLeft, pageRight, threshold);
    if (slots.length === 0) { y += LINE_HEIGHT; continue; }

    for (var si = 0; si < slots.length; si++) {
      var slot = slots[si];
      var slotWidth = slot.right - slot.left;
      if (slotWidth < 16) continue;

      var line = layoutNextLine(prepared, cursor, slotWidth);
      if (line === null) {
        cursor = { segmentIndex: 0, graphemeIndex: 0 };
        line = layoutNextLine(prepared, cursor, slotWidth);
        if (line === null) continue;
      }

      if (lineIndex >= linePool.length) {
        var el = document.createElement("div");
        el.className = "tl";
        stage.appendChild(el);
        linePool.push(el);
      }

      var el = linePool[lineIndex];
      el.textContent = line.text;
      el.style.left = Math.round(slot.left) + "px";
      el.style.top = Math.round(y) + "px";
      el.style.fontSize = "8.5px";
      el.style.lineHeight = LINE_HEIGHT + "px";
      el.style.display = "";
      el.style.color = "rgba(255, 255, 255, 1.0)";

      cursor = line.end;
      lineIndex++;
    }
    y += LINE_HEIGHT;
  }

  for (var i = lineIndex; i < linePool.length; i++) linePool[i].style.display = "none";
}

function drawFx() {
  fxCtx.clearRect(0, 0, W, H);
  for (var d = 0; d < drops.length; d++) {
    var dr = drops[d];
    var alpha = dr.opacity * dr.depth;
    fxCtx.strokeStyle = "rgba(160, 190, 230, " + alpha + ")";
    fxCtx.lineWidth = 0.5 + dr.depth * 0.5;
    fxCtx.beginPath();
    fxCtx.moveTo(dr.x, dr.y);
    fxCtx.lineTo(dr.x, dr.y - dr.len * dr.depth);
    fxCtx.stroke();
  }
}

// Touch interaction
stage.addEventListener("touchstart", function(e) {
  e.preventDefault();
  for (var i = 0; i < e.touches.length; i++) {
    var t = e.touches[i];
    simPoke(t.clientX, t.clientY, -180);
  }
}, { passive: false });
stage.addEventListener("touchmove", function(e) {
  e.preventDefault();
  for (var i = 0; i < e.touches.length; i++) {
    var t = e.touches[i];
    simPoke(t.clientX, t.clientY, -50);
  }
}, { passive: false });
// Mouse fallback for desktop preview
stage.addEventListener("click", function(e) {
  simPoke(e.clientX, e.clientY, -180);
});

// Prevent gestures that exit the experience
document.addEventListener("gesturestart", function(e) { e.preventDefault(); });
document.addEventListener("contextmenu", function(e) { e.preventDefault(); });

// Keep the screen awake + lock orientation when possible
var wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) {}
}
document.addEventListener("visibilitychange", function() {
  if (document.visibilityState === "visible") requestWakeLock();
});
function lockOrientation() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("portrait").catch(function(){});
    }
  } catch (e) {}
}
// These must be user-gesture initiated — fire on first touch
window.addEventListener("touchstart", function once() {
  requestWakeLock();
  lockOrientation();
  window.removeEventListener("touchstart", once);
}, { once: true, passive: true });

function init() {
  resize();
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function() {
    setTimeout(resize, 100);
  });
  for (var i = 0; i < 40; i++) drops.push(new Drop2(true));
  loop();
}

function loop() {
  var intensity = Number(document.getElementById("intensity").value);
  while (drops.length < intensity) drops.push(new Drop2(true));
  while (drops.length > intensity) drops.pop();

  for (var d = 0; d < drops.length; d++) drops[d].update();

  var speed = Number(document.getElementById("speed").value);
  for (var s = 0; s < speed; s++) simStep();

  layoutText();
  drawFx();
  requestAnimationFrame(loop);
}

document.fonts.ready.then(init);
</script>
</body>
